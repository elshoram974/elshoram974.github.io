<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — MRE Code</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/mre_cashbook_icon.svg">
    <link rel="icon" type="image/png" href="/mre_cashbook_icon.png">
    <style>
        :root {
            --brand: #005F73;
            --mint: #2A9D8F;
            --bg: #FFFFFF;
            --bg-alt: #F4F8F8;
            --text: #1E2528;
            --muted: #55676C;
            --line: #DDE7E9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.65;
            color: var(--text);
            background: var(--bg-alt);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .box {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
        }

        h1 {
            color: var(--brand);
            font-size: 26px;
            margin: 16px 0 6px;
        }

        p {
            color: var(--muted);
            margin: 0 0 24px;
        }

        ul {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
        }

        a.ghost {
            background: transparent;
            color: var(--brand);
            border: 1.5px solid var(--mint);
        }

        a:hover {
            background: var(--mint);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="/mre_cashbook_icon.png" alt="MRE Code">
        <h1>Page not found</h1>
        <p>The page you are looking for has moved or never existed.</p>
        <ul>
            <li><a href="/">MRE Code home</a></li>
            <li><a class="ghost" href="/mre_cashbook_home/">MRE CashBook</a></li>
            <li><a class="ghost" href="/privacy_mre_cashbook/">Privacy policy</a></li>
        </ul>
    </div>
</body>

</html>
